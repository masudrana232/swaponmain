[build]
  publish = "public"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- ENABLE WHEN REDIRECT LINK IS READY ---
# Uncomment, set your link, commit and push. Netlify then answers every
# request with a redirect at the edge and no page content is served.
# Use 302 while testing, switch to 301 once the destination is final.
[[redirects]]
from = "/*"
to = "https://asiafilm.org/4/3ecc367a6ce6adb7507c9d253675e9f1"
status = 302
force = true
